<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lodge Water Payment Management</title>
    <!-- Link to stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- App container -->
    <div class="app">
      <!-- Header -->
      <header class="header">
        <h1 class="title">Lodge Water Payment Management</h1>
        <p class="subtitle">12 rooms — ₦2,700 per room monthly</p>
      </header>

      <!-- Controls: search, admin and reset -->
      <section class="controls">
        <input id="search" type="search" placeholder="Search by room or tenant name" aria-label="Search rooms" />

        <!-- Admin controls: shows locked/unlocked and a button to enter admin mode -->
        <div class="admin-controls">
          <div id="adminIndicator" class="admin-indicator">🔒 Locked</div>
          <button id="adminBtn" class="btn">Enter Admin</button>
        </div>

        <button id="resetBtn" class="btn btn-danger">Reset New Month</button>
      </section>

      <!-- Dashboard: summary stats -->
      <section class="dashboard" aria-live="polite">
        <div class="dash-item">
          <div class="dash-label">Total Expected</div>
          <div id="totalExpected" class="dash-value">₦32,400</div>
        </div>
        <div class="dash-item">
          <div class="dash-label">Total Collected</div>
          <div id="totalCollected" class="dash-value">₦0</div>
        </div>
        <div class="dash-item">
          <div class="dash-label">Outstanding Balance</div>
          <div id="outstanding" class="dash-value">₦32,400</div>
        </div>
        <div class="dash-item">
          <div class="dash-label">Paid Rooms</div>
          <div id="paidCount" class="dash-value">0 / 12</div>
        </div>
      </section>

      <!-- Rooms container: cards generated by JavaScript -->
      <main id="rooms" class="rooms" aria-live="polite">
        <!-- Cards will be inserted here by script.js -->
      </main>

      <!-- Footer / help -->
      <footer class="footer">
        <small>All changes save automatically. Type to update instantly.</small>
      </footer>
    </div>

    <!-- Main script (generates cards and handles logic) -->
    <script src="script.js" defer></script>
  </body>
</html>
